apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: orderflow-api
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["orderflow-api-service.staging.svc.cluster.local:8080"]
      - job_name: node
        static_configs:
          - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]
  rules.yml: |
    groups:
      - name: orderflow-alerts
        rules:
          - alert: AppDown
            expr: up{job="orderflow-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "OrderFlow app is down"
          - alert: ServerMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Server has less than 10% memory free"
          - alert: ServerDiskHigh
            expr: 100 - (node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"} * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Server disk is more than 85% full"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
