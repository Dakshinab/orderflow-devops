apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: orderflow
        folder: OrderFlow
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  orderflow-overview.json: |
    {
      "title": "OrderFlow Overview",
      "uid": "orderflow-overview",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "App status",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
          "targets": [ { "expr": "up{job=\"orderflow-api\"}", "refId": "A" } ],
          "fieldConfig": {
            "defaults": {
              "mappings": [ { "type": "value", "options": {
                "0": { "text": "DOWN", "color": "red" },
                "1": { "text": "UP", "color": "green" } } } ]
            },
            "overrides": []
          }
        },
        {
          "id": 9, "type": "stat", "title": "Firing alerts",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
          "targets": [ { "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)", "refId": "A" } ],
          "options": { "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "id": 2, "type": "timeseries", "title": "App heap memory",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "targets": [ { "expr": "sum(jvm_memory_used_bytes{area=\"heap\"})", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "id": 3, "type": "timeseries", "title": "App CPU use",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "targets": [ { "expr": "process_cpu_usage{job=\"orderflow-api\"}", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "id": 4, "type": "timeseries", "title": "Order requests per second",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [ { "expr": "sum(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\"}[2m])) or vector(0)", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 5, "type": "timeseries", "title": "Average response time (orders)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [ { "expr": "sum(rate(http_server_requests_seconds_sum{uri!~\"/actuator.*\"}[2m])) / sum(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\"}[2m]))", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 6, "type": "timeseries", "title": "Server memory free (%)",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 14 },
          "targets": [ { "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 7, "type": "timeseries", "title": "Server disk used (%)",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 14 },
          "targets": [ { "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"} * 100)", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 8, "type": "timeseries", "title": "Server CPU use (%)",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 14 },
          "targets": [ { "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)", "refId": "A" } ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          resources:
            requests:
              memory: 100Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
